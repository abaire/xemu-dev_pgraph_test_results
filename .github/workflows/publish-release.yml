name: Publish Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name'
        required: true
        default: 'latest'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build Python Wheel & Source Distribution
        run: |
          python -m build

      - name: Package Standalone Bundle Archive
        run: |
          BUNDLE_NAME="xemu-dev-pgraph-bundle.tar.gz"
          tar -czf dist/${BUNDLE_NAME} \
            --exclude='.git*' \
            --exclude='.venv*' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='build' \
            --exclude='dist' \
            .
          echo "Created bundle archive dist/${BUNDLE_NAME}"

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false
