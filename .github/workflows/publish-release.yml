name: Publish Release Artifacts

on:
  push:
    tags:
      - 'v*'
      - 'scripts-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name'
        required: true
        default: 'latest'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create artifacts directory
        run: mkdir -p dist_release

      - name: Package for Windows
        run: |
          mkdir -p package/windows
          cp user_scripts/run.bat package/windows/
          cp README.md package/windows/
          cd package/windows && zip -r ../../dist_release/UserScripts-Windows.zip .

      - name: Package for macOS
        run: |
          mkdir -p package/macos
          cp user_scripts/run.sh package/macos/
          cp README.md package/macos/
          chmod +x package/macos/run.sh
          cd package/macos && zip -r ../../dist_release/UserScripts-macOS.zip .

      - name: Package for Linux
        run: |
          mkdir -p package/linux
          cp user_scripts/run.sh package/linux/
          cp README.md package/linux/
          chmod +x package/linux/run.sh
          cd package/linux && zip -r ../../dist_release/UserScripts-Linux.zip .

      - name: Package Standalone Bundle Archive
        run: |
          BUNDLE_NAME="xemu-dev-pgraph-bundle.tar.gz"
          tar -czf dist_release/${BUNDLE_NAME} \
            --exclude='.git*' \
            --exclude='.venv*' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='dist_release' \
            --exclude='package' \
            .
          echo "Created bundle archive dist_release/${BUNDLE_NAME}"

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            dist_release/UserScripts-Windows.zip
            dist_release/UserScripts-macOS.zip
            dist_release/UserScripts-Linux.zip
            dist_release/*.tar.gz
          draft: false
          prerelease: false
