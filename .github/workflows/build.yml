name: Build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Force re-compute all diffs for this branch'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  GetOutputPaths:
    name: Determine the path into which results for this branch will be written.
    runs-on: ubuntu-latest
    outputs:
      output_path: ${{ steps.get_output_path.outputs.output_path }}
      wiki_hw_diff_path: ${{ steps.get_output_path.outputs.wiki_hw_diffs }}
      wiki_xemu_diff_path: ${{ steps.get_output_path.outputs.wiki_xemu_diffs }}
      site_hw_diff_path: ${{ steps.get_output_path.outputs.site_hw_diffs }}
      site_xemu_diff_path: ${{ steps.get_output_path.outputs.site_xemu_diffs }}
      site_output_path: ${{ steps.get_output_path.outputs.site_output_path }}
      branch: ${{ steps.get_output_path.outputs.branch }}
      has_results: ${{ steps.get_output_path.outputs.has_results }}
      force_regenerate: ${{ steps.get_output_path.outputs.force_regenerate }}
    steps:
      - name: Clone tree
        uses: actions/checkout@v7
        with:
          fetch-depth: '1'
      - name: Get wiki output path and check for test results
        id: get_output_path
        run: |
          set -x
          branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          echo "branch=${branch}" >> $GITHUB_OUTPUT
          echo "force_regenerate=${{ inputs.force_regenerate }}" >> $GITHUB_OUTPUT
          # Replace any path separator characters in the branch name for 
          # artifact outputs.
          safe_branch="${branch//\//_}"
          echo "output_path=wiki/${safe_branch}" >> $GITHUB_OUTPUT 
          echo "wiki_hw_diffs=wiki/${safe_branch}/compare_hw" >> $GITHUB_OUTPUT 
          echo "wiki_xemu_diffs=wiki/${safe_branch}/compare_xemu" >> $GITHUB_OUTPUT 
          echo "site_output_path=site/${safe_branch}" >> $GITHUB_OUTPUT 
          echo "site_hw_diffs=site/${safe_branch}/compare_hw" >> $GITHUB_OUTPUT 
          echo "site_xemu_diffs=site/${safe_branch}/compare_xemu" >> $GITHUB_OUTPUT 

          has_results="false"
          if [ -d "results" ]; then
            if [ -n "$(find results -name '*.png' 2>/dev/null | head -n 1)" ]; then
              has_results="true"
            fi
          fi
          echo "has_results=${has_results}" >> $GITHUB_OUTPUT
          echo "Discovered test results in branch: ${has_results}"

  PlanHardwareDiffs:
    needs: [ GetOutputPaths ]
    name: Plan HW diff tasks
    runs-on: ubuntu-latest
    if: needs.GetOutputPaths.outputs.has_results == 'true'
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      diff_count: ${{ steps.plan.outputs.diff_count }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - name: Clone tree
        uses: actions/checkout@v7
        with:
          fetch-depth: '1'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install requirements
        run: |
          export PIP_BREAK_SYSTEM_PACKAGES=1
          pip3 install -r .github/scripts/requirements.txt
      - name: Plan diff tasks
        id: plan
        run: |
          python3 .github/scripts/plan_hw_diffs.py \
            --results-dir results \
            --output-dir "${{ needs.GetOutputPaths.outputs.wiki_hw_diff_path }}" \
            --max-shards 32 \
            --output-plan-file diff_tasks_hw.json \
            ${{ needs.GetOutputPaths.outputs.force_regenerate == 'true' && '--force' || '' }}
      - name: Upload plan artifact
        if: steps.plan.outputs.diff_count > '0'
        uses: actions/upload-artifact@v7
        with:
          name: hw-diff-plan
          path: diff_tasks_hw.json
          retention-days: 1

  GenerateHardwareDiffs:
    needs: [ GetOutputPaths, PlanHardwareDiffs ]
    name: Generate hardware diffs (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    if: needs.GetOutputPaths.outputs.has_results == 'true' && needs.PlanHardwareDiffs.outputs.diff_count > '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.PlanHardwareDiffs.outputs.matrix) }}
    timeout-minutes: 45
    steps:
      - name: Clone tree
        uses: actions/checkout@v7
        with:
          fetch-depth: '1'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y perceptualdiff
          export PIP_BREAK_SYSTEM_PACKAGES=1
          pip3 install -r .github/scripts/requirements.txt
      - name: Download plan
        uses: actions/download-artifact@v8
        with:
          name: hw-diff-plan
      - name: Generate new diffs
        run: |
          set -x
          python3 -m xemu_pgraph_ci_tools.hw_diffs \
            --tasks-file diff_tasks_hw.json \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ needs.PlanHardwareDiffs.outputs.shard_count }} \
            --output-dir "${{ needs.GetOutputPaths.outputs.wiki_hw_diff_path }}" \
            --stage-dir diff-staging
      - uses: actions/upload-artifact@v7
        with:
          name: hardware_diffs_shard_${{ matrix.shard }}
          path: diff-staging/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 1

  MergeHardwareDiffs:
    needs: [ GetOutputPaths, PlanHardwareDiffs, GenerateHardwareDiffs ]
    name: Merge hardware diff shards
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.GetOutputPaths.outputs.has_results == 'true' &&
      needs.PlanHardwareDiffs.result == 'success' &&
      (needs.GenerateHardwareDiffs.result == 'success' || needs.GenerateHardwareDiffs.result == 'skipped')
    steps:
      - name: Clone tree
        uses: actions/checkout@v7
        with:
          fetch-depth: '1'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install requirements
        run: |
          export PIP_BREAK_SYSTEM_PACKAGES=1
          pip3 install -r .github/scripts/requirements.txt
      - name: Download shard diffs
        if: needs.GenerateHardwareDiffs.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: hardware_diffs_shard_*
          path: incoming-diffs/
      - name: Merge diffs
        run: |
          mkdir -p "${{ needs.GetOutputPaths.outputs.wiki_hw_diff_path }}"
          if [ -d incoming-diffs ]; then
            echo "Merging incoming HW shard diffs..."
            for diff_dir in incoming-diffs/hardware_diffs_shard_*; do
              if [ -d "$diff_dir" ]; then
                echo "Merging $diff_dir..."
                rsync -av --exclude="KEEP_ARTIFACT" "$diff_dir/" .
              fi
            done
            rm -rf incoming-diffs
          fi
          rm -f KEEP_ARTIFACT
      - name: Reduce HW summaries
        run: |
          python3 -m xemu_pgraph_ci_tools.hw_diffs \
            --reduce-summaries \
            --output-dir "${{ needs.GetOutputPaths.outputs.wiki_hw_diff_path }}"
      - uses: actions/upload-artifact@v7
        with:
          name: hardware_diffs
          path: "${{ needs.GetOutputPaths.outputs.wiki_hw_diff_path }}/"
          if-no-files-found: warn
          compression-level: 1

  PlanXemuDiffs:
    needs: [ GetOutputPaths ]
    name: Plan Xemu baseline diff tasks
    runs-on: ubuntu-latest
    if: needs.GetOutputPaths.outputs.has_results == 'true'
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      diff_count: ${{ steps.plan.outputs.diff_count }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - name: Clone tree
        uses: actions/checkout@v7
        with:
          fetch-depth: '1'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install requirements
        run: |
          export PIP_BREAK_SYSTEM_PACKAGES=1
          pip3 install -r .github/scripts/requirements.txt
      - name: Fetch and Match Baseline
        run: python3 .github/scripts/fetch_baseline_artifact.py
      - name: Plan diff tasks
        id: plan
        run: |
          python3 .github/scripts/plan_xemu_diffs.py \
            --results-dir results \
            --baseline-dir "$XEMU_BASELINE_DIR" \
            --output-dir "${{ needs.GetOutputPaths.outputs.wiki_xemu_diff_path }}" \
            --max-shards 32 \
            --output-plan-file diff_tasks_xemu.json \
            ${{ needs.GetOutputPaths.outputs.force_regenerate == 'true' && '--force' || '' }}
      - name: Upload plan artifact
        if: steps.plan.outputs.diff_count > '0'
        uses: actions/upload-artifact@v7
        with:
          name: xemu-diff-plan
          path: diff_tasks_xemu.json
          retention-days: 1

  GenerateXemuDiffs:
    needs: [ GetOutputPaths, PlanXemuDiffs ]
    name: Generate diffs against baseline xemu release (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    if: needs.GetOutputPaths.outputs.has_results == 'true' && needs.PlanXemuDiffs.outputs.diff_count > '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.PlanXemuDiffs.outputs.matrix) }}
    timeout-minutes: 45
    steps:
      - name: Clone tree
        uses: actions/checkout@v7
        with:
          fetch-depth: '1'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install requirements
        run: |
          sudo apt-get update && sudo apt-get install -y perceptualdiff
          export PIP_BREAK_SYSTEM_PACKAGES=1
          pip3 install -r .github/scripts/requirements.txt
      - name: Fetch Baseline
        run: python3 .github/scripts/fetch_baseline_artifact.py
      - name: Download plan
        uses: actions/download-artifact@v8
        with:
          name: xemu-diff-plan
      - name: Generate new diffs
        run: |
          set -x
          python3 -m xemu_pgraph_ci_tools.xemu_diffs \
            --tasks-file diff_tasks_xemu.json \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ needs.PlanXemuDiffs.outputs.shard_count }} \
            --output-dir "${{ needs.GetOutputPaths.outputs.wiki_xemu_diff_path }}" \
            --stage-dir diff-staging
      - uses: actions/upload-artifact@v7
        with:
          name: xemu_diffs_shard_${{ matrix.shard }}
          path: diff-staging/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 1

  MergeXemuDiffs:
    needs: [ GetOutputPaths, PlanXemuDiffs, GenerateXemuDiffs ]
    name: Merge Xemu diff shards
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.GetOutputPaths.outputs.has_results == 'true' &&
      needs.PlanXemuDiffs.result == 'success' &&
      (needs.GenerateXemuDiffs.result == 'success' || needs.GenerateXemuDiffs.result == 'skipped')
    steps:
      - name: Clone tree
        uses: actions/checkout@v7
        with:
          fetch-depth: '1'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install requirements
        run: |
          export PIP_BREAK_SYSTEM_PACKAGES=1
          pip3 install -r .github/scripts/requirements.txt
      - name: Download shard diffs
        if: needs.GenerateXemuDiffs.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: xemu_diffs_shard_*
          path: incoming-diffs/
      - name: Merge diffs
        run: |
          mkdir -p "${{ needs.GetOutputPaths.outputs.wiki_xemu_diff_path }}"
          if [ -d incoming-diffs ]; then
            echo "Merging incoming Xemu shard diffs..."
            for diff_dir in incoming-diffs/xemu_diffs_shard_*; do
              if [ -d "$diff_dir" ]; then
                echo "Merging $diff_dir..."
                rsync -av --exclude="KEEP_ARTIFACT" "$diff_dir/" .
              fi
            done
            rm -rf incoming-diffs
          fi
          rm -f KEEP_ARTIFACT
      - name: Reduce Xemu summaries
        run: |
          python3 -m xemu_pgraph_ci_tools.xemu_diffs \
            --reduce-summaries \
            --output-dir "${{ needs.GetOutputPaths.outputs.wiki_xemu_diff_path }}"
      - uses: actions/upload-artifact@v7
        with:
          name: xemu_diffs
          path: "${{ needs.GetOutputPaths.outputs.wiki_xemu_diff_path }}/"
          if-no-files-found: warn
          compression-level: 1

  UpdateSite:
    name: Generate a comparison page in GitHub Pages for the current branch
    needs: [ GetOutputPaths, MergeHardwareDiffs, MergeXemuDiffs ]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.GetOutputPaths.outputs.has_results == 'true' &&
      (needs.MergeHardwareDiffs.result == 'success' || needs.MergeHardwareDiffs.result == 'skipped') &&
      (needs.MergeXemuDiffs.result == 'success' || needs.MergeXemuDiffs.result == 'skipped')
    permissions:
      contents: write
    outputs:
      site_sha: ${{ steps.commit.outputs.new_head_commit }}
    steps:
      - name: Clone tree
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install requirements
        run: |
          export PIP_BREAK_SYSTEM_PACKAGES=1
          pip3 install -r .github/scripts/requirements.txt
      - name: Prepare diff directories
        run: |
          mkdir -p "${{ needs.GetOutputPaths.outputs.site_hw_diff_path }}"
          mkdir -p "${{ needs.GetOutputPaths.outputs.site_xemu_diff_path }}"
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: hardware_diffs
          path: "${{ needs.GetOutputPaths.outputs.site_hw_diff_path }}"
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: xemu_diffs
          path: "${{ needs.GetOutputPaths.outputs.site_xemu_diff_path }}"
      - name: Generate Pages site
        run: |
          set -x
          python3 .github/scripts/generate_results_site.py \
            "${{ needs.GetOutputPaths.outputs.site_hw_diff_path }}" \
            "${{ needs.GetOutputPaths.outputs.site_xemu_diff_path }}" \
            "${{ needs.GetOutputPaths.outputs.branch }}" \
            --templates-dir ".github/scripts/site-templates" \
            --output-dir "site" \
            --results-base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads" \
            --site-resources-base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/pages-branch"
          ls site
      - name: Switch to pages-branch to restore existing content
        run: |
          set -x
          git fetch
          git status
          tar -czf updated_site.tgz "${{ needs.GetOutputPaths.outputs.site_output_path }}"
          # Delete in case files that exist in the pages branch were modified.
          rm -rf "${{ needs.GetOutputPaths.outputs.site_output_path }}"
          rm -f site/*.* 
          ls site/
          git switch -f pages-branch || (git checkout main && git checkout -b pages-branch)
          ls site/
          # Delete again in case this branch was already present in the pages-branch
          rm -rf "${{ needs.GetOutputPaths.outputs.site_output_path }}"
          tar -xzf updated_site.tgz
          rm updated_site.tgz
          ls site/
      - name: Regenerate the Pages top level index so it includes the previously generated content.
        run: |
          set -x
          python3 .github/scripts/generate_results_site.py \
            "${{ needs.GetOutputPaths.outputs.site_hw_diff_path }}" \
            "${{ needs.GetOutputPaths.outputs.site_xemu_diff_path }}" \
            "${{ needs.GetOutputPaths.outputs.branch }}" \
            --templates-dir ".github/scripts/site-templates" \
            --top-index-only \
            --output-dir "site" \
            --results-base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads" \
            --site-resources-base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/pages-branch"
          ls site
      - name: Commit changes
        id: commit
        run: |
          set -x
          git config --local user.email "$GITHUB_ACTOR+github-actions@users.noreply.github.com"
          git config --local user.name "$GITHUB_ACTOR via action"
          git status
          git add site
          git diff-index --quiet HEAD || git commit -m "Update from github action $GITHUB_RUN_NUMBER - $GITHUB_SHA"
          git push -f || git push --set-upstream origin pages-branch -f

          sha_new=$(git rev-parse HEAD)
          echo ${sha_new}
          echo "new_head_commit=${sha_new}" >> $GITHUB_OUTPUT

  DeploySite:
    runs-on: ubuntu-latest
    needs: [ UpdateSite ]
    if: needs.UpdateSite.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Print site sha
        run: echo "Site SHA is ${{ needs.UpdateSite.outputs.site_sha }}"
      - name: Clone tree
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.UpdateSite.outputs.site_sha }}
          fetch-depth: 1
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
